[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wynnmcp"
version = "0.1.0"
description = "WynnMCP: a Python MCP server for the Wynncraft v3 API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[project.scripts]
wynnmcp = "wynnmcp.server:main"

[project.urls]
Repository = "https://github.com/RedCokeDevelopment/WynnMCP"
Issues = "https://github.com/RedCokeDevelopment/WynnMCP/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["work", "dist"]
